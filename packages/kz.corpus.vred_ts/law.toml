# Manifest §10 — package root marker (DECISION-0033). The headers §22
# in the .law files themselves are normative; the manifest must match them (LDC-E1109, lawc check).
[package]
name = "kz.corpus.vred_ts"
version = "0.1.0"
language = "0.2"
namespace = "urn:kz:corpus:clir:vred-ts"

# Catalog metadata (DECISION-0051; docs/PACKAGE-METADATA.ru.md). NOT semantics:
# it is not lowered into CLIR and does not enter the semantic hash §209. Derived fields
# (jurisdiction ← source jurisdiction, instrument ← kind, sourceFidelity ←
# materialization_status) are checked against the source declarations by the gate
# verify/ci/gates/coverage/check_package_metadata.py.
[metadata]
act = "kz-vred-ts"
title = "Правила определения размера вреда, причиненного транспортному средству"
primarySource = "VRED_TS"
jurisdiction = "KZ"
instrument = "resolution"
sourceFidelity = "pinned_unofficial_copy"
# issuer: named in the resolution's own first line and its number in the
# source declaration — the Board of the National Bank. The field is not derived by
# any gate, hence it is recorded with this reason.
issuer = "Правление Национального Банка Республики Казахстан"
# legalStatus: the edition is declared `in_force [@2016-02-08, infinity)`; the act
# has not been recognized as having lost force; the pinned bytes carry no marking
# excluding any clause.
legalStatus = "in_force"
# verifiedAgainstSource: each fragment is an EXACT substring of the pinned
# publication (checked by LDC-E5202), and the publication itself is an archival snapshot
# of the "Әділет" page, i.e. a copy of the official text, not its official
# bytes — hence `pinned_unofficial_copy` on the line above. The fragment texts
# are not stand-ins: they are the act's own bytes, not an instructional fabrication.
verifiedAgainstSource = true

# Official calendar §85 (DECISION-0175): pin §11 instead of the previous
# summing of nodes without a declared dependency.
[dependencies]
"kz.corpus.clir.official_calendar" = "0.1.0"

# Hand-written package scenarios: executed by the common runner,
# not counted toward regression coverage. Files are laid out in subject
# directories `tests/<area>/` mirroring `modules/<area>/`; a scenario
# that checks several areas at once lives in `tests/integration/`.
# The split into family parts stays the same: the §85 calendar enters the world
# for exactly the scenarios that require it.
[[tests]]
family = "kz.corpus.vred_ts#authored"
regression = false

# Scenarios without the calendar: thresholds, document composition, incomplete inputs.
[[tests.part]]
suites = ["tests/vyplata/01-porog-80-procentov-ne-preyshen.lawtest",
      "tests/vyplata/18-chislovye-granitsy.lawtest", "tests/vyplata/02-porog-80-procentov-preyshen.lawtest", "tests/detali/03-probeg-fizlitso-15000.lawtest", "tests/detali/04-probeg-fizlitso-15001.lawtest", "tests/detali/05-probeg-yurlitso-20000.lawtest", "tests/detali/06-probeg-yurlitso-20001.lawtest", "tests/raschet/07-dva-otsenshchika.lawtest", "tests/raschet/08-odin-otsenshchik.lawtest", "tests/osmotr/09-prilozhenie-2-podpunkty.lawtest", "tests/osmotr/19-znacheniya-akta.lawtest", "tests/osmotr/10-dopolnitelnyy-osmotr.lawtest", "tests/detali/12-detal-dva-usloviya.lawtest", "tests/otchet/13-prilozhenie-3-elementy.lawtest", "tests/otchet/20-znacheniya-otcheta.lawtest", "tests/integration/15-nepolnye-i-protivorechivye-vkhody.lawtest", "tests/otchet/16-srok-bez-kalendarya.lawtest", "tests/integration/17-pozitsii-otkrytykh-okon.lawtest"]
world = ["kz.corpus.vred_ts"]

# Clause 3 deadline scenarios: a world with a snapshot of the official calendar §85.
[[tests.part]]
suites = ["tests/otchet/11-obyazannost-predostavit-otchet.lawtest", "tests/otchet/14-sroki-granitsy-kalendarya.lawtest"]
world = ["kz.corpus.vred_ts", "kz.corpus.clir.official_calendar"]

# Comparison with the independent Catala model (tools/catala/): generated by
# `tools/catala/compare.py --emit` from tools/catala/cases.json, expectations are
# the cases.json reference values.
[[tests]]
family = "kz.corpus.vred_ts#catala-parity"
regression = false

[[tests.part]]
suites = ["tests/parity/parity.lawtest"]
world = ["kz.corpus.vred_ts"]

[[tests.part]]
suites = ["tests/parity/parity-sroki.lawtest"]
world = ["kz.corpus.vred_ts", "kz.corpus.clir.official_calendar"]

# Package scenarios: the single source of facts, questions and expectations.
[[tests]]
family = "vred_ts"

# A family part with its own program (§267.1).
[[tests.part]]
suites = ["tests/regression/vred-ts.lawtest"]
world = ["kz.corpus.vred_ts", "kz.corpus.clir.official_calendar"]

# A family part with its own program (§267.1).
[[tests.part]]
suites = ["tests/regression/vred-ts-w2.lawtest"]
world = ["kz.corpus.vred_ts", "kz.corpus.clir.official_calendar"]
