# Позиции статей 16—18, 20-1 и 21: права и обязанности сторон и уплата премии.
# Мир несёт снимок официального календаря §85 через `concat`, а не `world`:
# пакет зависимости от него НЕ объявляет (`[dependencies]` — бюджет и Правила
# определения размера вреда), а связывание §23 требует объявленного импорта.
# Ресурс самого набора у пакета уже закреплён — `law.lock`, `resources`,
# `../../../clir/kz-official-2026.calendar.json`.
[[tests]]
family = "kz.corpus.ogpovts#pozitsii"
regression = false
suites = [
  "tests/ogpo-16-17-regress-i-omdusman.lawtest",
  "tests/ogpo-16-17-zaklyuchenie-dogovora.lawtest",
  "tests/ogpo-16-obyazannosti-voditelya.lawtest",
  "tests/ogpo-16-prava-strakhovatelya.lawtest",
  "tests/ogpo-16-uvedomlenie-o-proisshestvii.lawtest",
  "tests/ogpo-17-dlyashchiesya-obyazannosti.lawtest",
  "tests/ogpo-17-sroki-strakhovshchika.lawtest",
  "tests/ogpo-18-prava-poterpevshego.lawtest",
  "tests/ogpo-20-1-dopolnitelnye-uslugi.lawtest",
  "tests/ogpo-21-uplata-premii.lawtest",
  "tests/ogpo-26-granitsa-redaktsii.lawtest",
  "tests/ogpo-26-ispolnenie-iz-dnya-vyplaty.lawtest",
  "tests/ogpo-26-1-otmena-primenimosti-obshchego-sroka.lawtest",
]
