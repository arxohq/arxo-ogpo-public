# Манифест §10 — маркер корня пакета (DECISION-0033). Нормативны заголовки §22
# в самих .law; манифест обязан с ними совпадать (LDC-E1109, lawc check).
[package]
name = "kz.corpus.ogpovts"
version = "0.1.0"
language = "0.2"
namespace = "urn:kz:corpus:clir:ogpo-vts"

# `law.decision/0.1` — сетки коэффициентов статьи 19 и шкала удержания статьи
# 15: конечные матрицы «условие → величина», каждая строка со своим якорем.
#
# `law.params/0.1` НЕ включён, и это следствие текста, а не экономия. У ОСМС
# ставки — расписание по датам (`effective`), потому что закон менял их
# поправками и портал отдаёт все окна; здесь величины стоят прямо в статье 19
# закреплённой редакции, и оси времени у них нет. Ось времени у пакета одна —
# сама редакция (`in_force` в sources.law). Появится редакция с другими
# коэффициентами — появится вторая редакция, а не второе окно параметра.
# Зависимости §10/§23: оба импорта пакета объявлены — бюджетный закон (МРП
# статьи 19) и Правила определения размера вреда, которые читает статья 22.
[dependencies]
"kz.corpus.budget" = "0.1.0"
"kz.corpus.vred_ts" = "0.1.0"
# Коэффициент «бонус-малус» пункта 10 статьи 19 — с 13.09.2026 ВЫВОДИТСЯ, а не
# входит фактом дела: порядок его расчёта определён постановлением Правления
# НБ РК № 140, и владельцем этой нормы стал `kz.corpus.bonus_malus`.
"kz.corpus.bonus_malus" = "0.2.0"
# Общий словарь регионов (DECISION-0139): двадцать территорий пункта 3
# статьи 19 названы им для соседей — `pub enum` членов не экспортирует.
"vocab.geo" = "0.1.0"
# Общий словарь транспортных средств (DECISION-0139): `entity Vehicle` пакета
# заменён алиасом словарного типа, а срез видов пункта 6 статьи 19 связан с
# видами словаря отношением `vehicle_type_kind` (package.law).
"vocab.vehicle" = "0.1.0"

# Каркасы профиля развёртки 0.2 (DECISION-0209, пилот Р8): девять
# обязанностей со сроком делом глав 16, 22, 26, 28 записаны экземплярами
# `expand`; пин — секция `expansions` law.lock (`gen_kz_clir.py --relock-expansions`).
[expansions]
matter_deadline_duty = { name = "law.expansions.matter_deadline_duty", version = "0.1.0", path = "expansions/matter_deadline_duty" }
claim_deadline_duty = { name = "law.expansions.claim_deadline_duty", version = "0.1.0", path = "expansions/claim_deadline_duty" }

[features]
enabled = ["law.decision/0.1"]
semanticLayer = "L1"

# Каталожная метадата (DECISION-0051; docs/PACKAGE-METADATA.ru.md). НЕ семантика:
# в CLIR не понижается, в semantic hash §209 не входит. Выводимые поля
# (`jurisdiction` ← jurisdiction источника, `instrument` ← kind,
# `sourceFidelity` ← materialization_status, `primarySource` ← source)
# сверяются с декларациями `sources.law` воротами check_package_metadata.py.
[metadata]
act = "kz-ogpo-vts"
title = "Закон РК «Об обязательном страховании ГПО владельцев транспортных средств» (446-II)"
primarySource = "LAW_446"
jurisdiction = "KZ"
instrument = "law"
sourceFidelity = "pinned_unofficial_copy"
# Невыводимые поля не сверяет никто — потому причина выбора записана.
#
# `legalStatus = "in_force"`: закон действует. Основание — не умолчание, а
# сам закреплённый текст: портал отдаёт консолидированную редакцию, в которой
# три поправки 2026 года (256-VIII, 259-VIII, 352-VIII) объявлены ВВОДИМЫМИ В
# ДЕЙСТВИЕ в будущем. Отменённый закон не поправляют вперёд.
legalStatus = "in_force"
# `issuer = "Парламент Республики Казахстан"`: акт принят в форме закона
# (`kind law`, номер «446-II» — нумерация созывов Парламента) и подписан
# Президентом; подпись стоит в закреплённых байтах последней строкой.
issuer = "Парламент Республики Казахстан"

# Рукописные сценарии пакета: исполняются общим раннером,
# в учёт покрытия регрессии не входят.
[[tests]]
family = "kz.corpus.ogpovts#authored"
