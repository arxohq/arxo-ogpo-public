concat = ["kz.corpus.clir.official_calendar"]

# Наряд «страховой случай»: статьи 22 (остаток), 22-1, 22-2 (остаток),
# 25 (остаток), 29-1. Мир шире, чем у семейства `#authored`: сценарии считают
# дневные сроки §86 (снимок официального календаря §85), читают МРП
# (`kz.corpus.budget`) и вывод нормативного правового акта уполномоченного
# органа о непредоставлении отчёта (`kz.corpus.vred_ts`, пункт 3-1 статьи 22).
[[tests]]
family = "kz.corpus.ogpovts#sluchay"
regression = false
suites = ["tests/ogpo-st22-1-skhema-proisshestviya.lawtest", "tests/ogpo-st22-2-uproshchennyy-poryadok.lawtest", "tests/ogpo-st22-opredelenie-vreda.lawtest", "tests/ogpo-st22-osmotr-sroki.lawtest", "tests/ogpo-st22-punkt-3-1-otsenshchik.lawtest", "tests/ogpo-st25-usloviya-vyplaty.lawtest", "tests/ogpo-st29-1-spory.lawtest"]
world = ["kz.corpus.ogpovts", "kz.corpus.budget", "kz.corpus.vred_ts", "kz.corpus.clir.official_calendar", "vocab.vehicle"]

# Агрегаты по множеству (несколько застрахованных, потерпевших,
# причинителей, история выплат) и оставшиеся пункты статьи 19.
#
# `kz.corpus.budget_code` УБРАН ИЗ МИРА 13.09.2026, и это исправление, а не
# сужение покрытия. Предикат МРП носит пространство имён бюджетного кодекса,
# но нормативный факт `kz.corpus.budget_code::mrp(2026, 4325 KZT)` объявлен
# внутри пакета `kz.corpus.budget` — снимок бюджетного кодекса семейству не
# нужен ни для одной посылки. Зато он тянул за собой ресурс `calendar-dataset`
# узла `budget-code#calendar-snapshot`, чей `datasetHash` в снимке
# `kz-budget-code.lawir.json` остался прежним (`a17b851a…`) после того, как
# сосед пересобрал общий набор календаря (`d04f4876…`, коммит c1fe765214,
# многолетний календарь). Из-за этого все семнадцать сцен семейства были
# КРАСНЫ в рабочем дереве: «набор календаря … не даёт закреплённый datasetHash
# (§85)». Снимок бюджетного кодекса — чужой замороженный пакет, и чинить
# расхождение пересборкой ЕГО снимка отсюда нельзя; убранный лишний участник
# мира чинит семейство, ничего чужого не трогая. Полный долг — двенадцать
# локов корпуса, остальные девяносто шесть уже на новых байтах.
[[tests]]
family = "kz.corpus.ogpovts#agregaty"
regression = false
suites = ["tests/ogpo-premium-short-term.lawtest", "tests/ogpo-premium-multi-unit.lawtest", "tests/ogpo-property-multi-victim.lawtest", "tests/ogpo-payment-recalculation.lawtest", "tests/ogpo-several-tortfeasors.lawtest", "tests/ogpo-19-vid-ts-slovarya.lawtest"]
world = ["kz.corpus.ogpovts", "kz.corpus.budget", "kz.corpus.bonus_malus", "vocab.geo", "vocab.vehicle"]
# `kz.corpus.popravochnye_koeffitsienty` приходит через `concat`, а не `world`,
# и это следствие направления импорта. Пакет размеров ИМПОРТИРУЕТ закон (его
# двадцать территорий), а закон его — нет; связывание §23 требует, чтобы
# участник мира был объявленным импортом другого участника, и обратного
# ребра здесь нет по построению. Тот же приём уже применён к снимку
# официального календаря §85 у семейств `#pozitsii` и `#dogovor-sroki`.
concat = ["kz.corpus.popravochnye_koeffitsienty"]

# Пункт 4 статьи 19, условие «в областях» (DECISION-0336). Мир без пакета
# размеров: поправочный коэффициент п. 3-1 подан фактом дела, проверяется одна норма.
[[tests]]
family = "kz.corpus.ogpovts#territoriya-p4"
regression = false
suites = ["tests/ogpo-19-p4-v-oblastyakh.lawtest"]
world = ["kz.corpus.ogpovts", "kz.corpus.budget", "kz.corpus.bonus_malus", "vocab.geo", "vocab.vehicle"]

# Чужие калькуляторы годовой премии (calk.kz, calculators.kz), 14.09.2026.
# Сценарии ПОРОЖДЕНЫ `tools/foreign_premium.py --emit` из
# `tools/foreign-premium-cases.json`: ожидание — независимая модель по
# закреплённым текстам, чужой ответ — прогон их закреплённого кода;
# квалификация расхождений — `tests/foreign/REPORT.md`. Мир тот же, что у
# `#agregaty`: поправочный коэффициент выводит пакет размеров через `concat`.
[[tests]]
family = "kz.corpus.ogpovts#chuzhie-kalkulyatory"
regression = false
suites = ["tests/ogpo-chuzhoy-almaty-car-30-5-k3.lawtest", "tests/ogpo-chuzhoy-astana-car-24-1-old-k3.lawtest", "tests/ogpo-chuzhoy-almaty-oblast-village-car-40-10-k13.lawtest", "tests/ogpo-chuzhoy-zhambyl-truck-45-20-k5.lawtest", "tests/ogpo-chuzhoy-kyzylorda-bus16-35-8-kM.lawtest", "tests/ogpo-chuzhoy-shymkent-bus-over16-50-25-old-k3.lawtest", "tests/ogpo-chuzhoy-atyrau-moto-22-3-k3.lawtest", "tests/ogpo-chuzhoy-vko-trailer-60-30-old-k13.lawtest", "tests/ogpo-chuzhoy-karaganda-village-tram-40-10-k0.lawtest", "tests/ogpo-chuzhoy-kostanay-car-25-2-k3.lawtest", "tests/ogpo-chuzhoy-pavlodar-car-30-5-first.lawtest", "tests/ogpo-chuzhoy-akmola-taxi-legal-entity.lawtest", "tests/ogpo-chuzhoy-ulytau-car-19-0-new-k3.lawtest", "tests/ogpo-chuzhoy-mangystau-village-bus16-33-12-k8.lawtest", "tests/ogpo-chuzhoy-zko-truck-23-1-old-kM2.lawtest", "tests/ogpo-chuzhoy-sko-car-45-3-k10.lawtest", "tests/ogpo-chuzhoy-turkestan-village-car-28-1-old-k2.lawtest", "tests/ogpo-chuzhoy-abay-light-truck-38-15-old-k4.lawtest"]
