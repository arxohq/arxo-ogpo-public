    "tests/ogpo-art3-object-of-insurance.lawtest",
    "tests/ogpo-art7-p1-prohibition-active.lawtest",
    "tests/ogpo-art7-p1-prohibition-defeated.lawtest",
    "tests/ogpo-art7-p2-control-duty.lawtest",
