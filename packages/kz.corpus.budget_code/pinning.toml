# Кодекс делится на разделы и главы; без обоих стопов последняя статья главы
# утягивает заголовок соседней, и локатор начинает адресовать чужой текст:
#   chapter — 33 главы, без стопа ст. 6 утянула бы «Глава 2» с её статьями;
#   section — 8 разделов, граница раздела не всюду совпадает с границей главы
#             (между ними стоят «ОБЩАЯ ЧАСТЬ» и «ОСОБЕННАЯ ЧАСТЬ»).
# Форма `chapter-amended` не берётся сознательно: глав с дефисным номером в
# закреплённой редакции нет (0 вхождений `^Глава N-M.`), и включение образца
# «на будущее» сдвинуло бы границы уже закреплённых статей при первой же
# добавленной главе — молча.
stops     = ["chapter", "section"]

